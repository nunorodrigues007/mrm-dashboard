name: ✅ Tests

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Teste de integração do fetch_data.py (sem rede)
        run: python tests/test_build_data.py
      - name: Testes do update_portfolio.py (sem rede)
        run: python tests/test_update_portfolio.py
